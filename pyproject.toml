[project]
name = "solana"
version = "0.34.0"
description = "Solana Python API"
authors = [
  { name = "Michael Huang", email = "michaelhly@gmail.com" },
  { name = "Kevin Heavey", email = "heaveykevin2@gmail.com" },
]
requires-python = ">=3.8"
readme = "README.md"
license = "MIT"
keywords = ["solana", "blockchain", "web3"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
]
dependencies = [
  "construct-typing>=0.5.2,<0.6",
  "httpx>=0.23.0",
  "typing-extensions>=4.2.0",
  "websockets>=9.0,<12.0",
  "solders>=0.21.0,<0.22",
]

[project.urls]
Homepage = "https://github.com/michaelhly/solanapy"
Documentation = "https://michaelhly.github.io/solana-py/"

[dependency-groups]
dev = [
  "black~=22.3",
  "pytest>=7.4.3,<8",
  "mypy>=0.910,<0.911",
  "pyyaml==6.0.1",
  "pytest-docker>=2.0.1,<3",
  "requests==2.28.1",
  "bump2version>=1.0.1,<2",
  "pytest-asyncio>=0.18.3,<0.19",
  "pytest-cov>=3.0.0,<4",
  "asyncstdlib>=3.10.2,<4",
  "mkdocstrings>=0.18.0,<0.19",
  "mkdocs-material>=8.2.1,<9",
  "ruff>=0.0.219,<0.0.220",
]

[tool.hatch.build.targets.sdist]
include = ["src/solana", "src/spl"]

[tool.hatch.build.targets.wheel]
include = ["src/solana", "src/spl"]

[tool.hatch.build.targets.wheel.sources]
"src/solana" = "solana"
"src/spl" = "spl"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

# Enable Pyflakes `E` and `F` codes by default.
select = [
  "A",
  "B",
  "D",
  "E",
  "F",
  "I",
  "ARG",
  "BLE",
  "C4",
  "SIM",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "RUF",
]
ignore = ["D203", "I001"]

# Exclude a variety of commonly ignored directories.
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "venv",
]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Assume Python 3.10.
target-version = "py310"

[tool.ruff.pydocstyle]
convention = "google"

[tool.ruff.per-file-ignores]
"src/solana/blockhash.py" = ["A003"]
"tests/**/*.py" = ["D100", "D103", "ARG001"]

[tool.black]
line-length = 120

[tool.pyright]
reportMissingModuleSource = false
